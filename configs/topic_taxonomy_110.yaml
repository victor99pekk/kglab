# Polygraph starter topic taxonomy
#
# Purpose: fixed multilabel vocabulary for Level 1/Level 2 experiments.
# This is a human-curated, stable 110-label subset inspired by Wikipedia
# Vital Articles, DBpedia Ontology, and Wikidata top-level classes.
# Keep labels broad enough for article-level classification. Add new concepts
# through unknown_topic rather than silently changing existing IDs.
#
# Labeling policy:
# - Assign every applicable topic; multilabel output is expected.
# - Prefer the most specific listed topic, plus a parent only when the model
#   explicitly trains hierarchical labels.
# - Use unknown_topic when no listed topic is defensible; retain the generated
#   candidate and review it before adding a new fixed label.

version: "1.0"
label_count: 110
unknown_label: unknown_topic

source_basis:
  - name: Wikimedia Vital Articles / Expanded list
    url: https://meta.wikimedia.org/wiki/10000_articles
    use: article coverage and seed sampling
  - name: DBpedia Ontology
    url: https://www.dbpedia.org/resources/ontology/
    use: Wikipedia-derived class and property vocabulary
  - name: Wikidata top-level ontology
    url: https://www.wikidata.org/wiki/Wikidata:WikiProject_Ontology/Top-level_ontology_list
    use: broad cross-domain superclass structure
  - name: Wikimedia dump licensing
    url: https://dumps.wikimedia.org/legal.html
    use: reuse and attribution review

