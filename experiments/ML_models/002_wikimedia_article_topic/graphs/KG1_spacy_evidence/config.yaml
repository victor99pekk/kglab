id: "KG1-A.2"
name: "spaCy feature evidence graph"
status: "neo4j_pilot_confirmed"

classification_target: "article"
label_count: 64
labels_as_message_edges: false

entity_extraction:
  primary: "wikipedia_hyperlink_qid"
  recovery: "spacy_ner"
  spacy_model: "en_core_web_sm"
  noun_chunks: false
  fail_if_model_missing: true

evidence_node_types:
  - "article"
  - "chunk"
  - "mention"
  - "entity"

evidence_edge_types:
  - "has_chunk"
  - "next"
  - "has_mention"
  - "refers_to"
  - "mentions"
  - "links_to"
  - "describes"

gnn_projection:
  node_types:
    - "article"
    - "chunk"
    - "entity"
  edge_types:
    - "has_chunk"
    - "next"
    - "mentions"
    - "links_to"
    - "describes"
  entity_type_representation: "spacy_type_counts_attribute"
  mention_nodes_in_projection: false
  add_reverse_edges_at_training: true

provenance:
  required_article_fields:
    - "dataset_article_id"
    - "article_revision_id"
  required_mention_fields:
    - "chunk_id"
    - "start_char"
    - "end_char"
    - "extractor"
    - "spacy_type"

next_variant:
  id: "KG1-B"
  addition: "evidence-backed dependency claims"
  promotion_gate: "manual relation precision >= 0.85"
