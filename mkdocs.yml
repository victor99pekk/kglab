site_name: Polygraph
site_description: Research toolkit for building high-quality knowledge graphs for LLM training
repo_url: https://github.com/victor99pekk/polygraph
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: README.md
  - Tutorial: docs/tutorial.md
  - API Reference: docs/api_reference.md
  - Input Data Format: docs/input_data_format.md
  - Contributing: CONTRIBUTING.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
